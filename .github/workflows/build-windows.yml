name: Build Windows EXE
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
          architecture: x64
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-build.txt
      - name: Install dependencies
        run: python -m pip install -r requirements-build.txt
      - name: Unit tests (no live API or physical network changes)
        run: python scripts/run_tests.py
      - name: Build executable with Tkinter
        shell: pwsh
        run: ./build.ps1
      - name: Verify Tcl/Tk in packaged executable
        shell: pwsh
        run: |
          $taskExecutable = (Resolve-Path -LiteralPath dist/ClipboardAI.exe).Path
          $taskProcess = Start-Process -FilePath $taskExecutable -ArgumentList '--verify-tk' -WindowStyle Hidden -PassThru
          if (-not $taskProcess.WaitForExit(45000)) {
            Stop-Process -Id $taskProcess.Id -Force -ErrorAction SilentlyContinue
            throw 'Packaged Tcl/Tk verification timed out'
          }
          if ($taskProcess.ExitCode -ne 0) { throw 'Packaged Tcl/Tk verification failed' }
          $taskReport = Get-Content -LiteralPath dist/tk-verification.json -Raw | ConvertFrom-Json
          $taskReport | ConvertTo-Json
          if (-not $taskReport.ok -or -not $taskReport.frozen) { throw 'Packaged Tcl/Tk report is invalid' }
      - name: Verify automatic Codex install without existing CLI or login
        shell: pwsh
        run: |
          $taskExecutable = (Resolve-Path -LiteralPath dist/ClipboardAI.exe).Path
          $taskProcess = Start-Process -FilePath $taskExecutable -ArgumentList '--verify-codex-setup' -WindowStyle Hidden -PassThru
          if (-not $taskProcess.WaitForExit(240000)) {
            Stop-Process -Id $taskProcess.Id -Force -ErrorAction SilentlyContinue
            throw 'Packaged Codex setup verification timed out'
          }
          if ($taskProcess.ExitCode -ne 0) { throw 'Packaged Codex setup verification failed' }
          $taskReport = Get-Content -LiteralPath dist/codex-setup-verification/report.json -Raw | ConvertFrom-Json
          if (-not $taskReport.ok -or -not $taskReport.app_server_initialized -or $taskReport.login_requests -ne 0 -or $taskReport.inference_requests -ne 0) { throw 'Codex setup report is invalid' }
      - name: Upload executable and instructions
        uses: actions/upload-artifact@v6
        with:
          name: ClipboardAI-Windows-x64
          path: |
            dist/ClipboardAI.exe
            dist/cua-driver.exe
            dist/cua-driver-uia.exe
            dist/CUA_VERSION.txt
            dist/cua-licenses/**
            dist/README.md
            dist/CHUC_NANG.md
            dist/API_PROVIDERS.md
            dist/.env.example
            dist/SHA256.txt
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
